name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Actions are pinned to a full commit SHA (the tag is in the comment) and the runner image is fixed,
# so an upstream retag or the ubuntu-latest switch cannot change CI without a reviewed commit.
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: docente_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Install scripts, the build and the tests never need the token.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/docente lint
      - run: pnpm --filter @workspace/docente typecheck
      - run: pnpm --filter @workspace/docente test
      - run: pnpm --filter @workspace/docente test:rls
        env:
          EPHEMERAL_DATABASE_URL: postgres://postgres:ephemeral_ci_only@127.0.0.1:5432/docente_ci
      - run: pnpm --filter @workspace/docente build
      - run: pnpm --filter @workspace/docente exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/docente test:smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-report
          path: artifacts/docente/playwright-report
          retention-days: 7
