name: E2E staging
# Manual only: it signs in to staging with a test teacher account and makes sandbox (test) payments.
# Nothing here uses a paid service. Required secrets (Settings > Secrets and variables > Actions):
#   E2E_BASE_URL, E2E_DOCENTE_EMAIL, E2E_DOCENTE_PASSWORD
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-staging
  cancel-in-progress: false
# Actions are pinned to a full commit SHA (the tag is in the comment) and the runner image is fixed,
# so an upstream retag or the ubuntu-latest switch cannot change CI without a reviewed commit.
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secrets are in the environment of the test step: keep the token out of .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/docente exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/docente test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_DOCENTE_EMAIL: ${{ secrets.E2E_DOCENTE_EMAIL }}
          E2E_DOCENTE_PASSWORD: ${{ secrets.E2E_DOCENTE_PASSWORD }}
          # No page snapshot (error-context.md) on failure: it would copy form values into the artifact.
          PLAYWRIGHT_NO_COPY_PROMPT: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Only on failure, only the HTML report, kept for one day.
        if: failure()
        with:
          name: e2e-staging-report
          path: artifacts/docente/playwright-report
          retention-days: 1
